<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion En Ligne Synchrone</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        #status {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #00adb5;
            font-weight: bold;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 20px auto;
        }
        .cell {
            background-color: #2a2a35;
            border: 2px solid #3f3f5c;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: bold;
            line-height: 100px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        .cell:hover { background-color: #3f3f5c; }
        .cell.X { color: #ff2e63; }
        .cell.O { color: #08d9d6; }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #00adb5;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #008c9e; }
    </style>
</head>
<body>

    <h1>Morpion Multi-Appareils</h1>
    <div id="status">Connexion au serveur...</div>
    
    <div id="game-board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button onclick="resetGame()">Réinitialiser la partie</button>

    <script>
        // Utilisation d'un serveur WebSocket public de démo pour l'envoi de messages
        const socket = new WebSocket('wss://://socketsbay.com');
        
        let board = ["", "", "", "", "", "", "", "", ""];
        let mySign = null; 
        let currentTurn = "X";
        let gameActive = true;

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        socket.onopen = () => {
            statusDisplay.innerText = "Connecté ! Cliquez sur une case pour attribuer votre rôle (X ou O).";
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "move") {
                board = data.board;
                currentTurn = data.nextTurn;
                updateUI();
                checkResult();
            } else if (data.type === "reset") {
                board = ["", "", "", "", "", "", "", "", ""];
                currentTurn = "X";
                gameActive = true;
                updateUI();
                statusDisplay.innerText = "Partie réinitialisée. Au tour des X !";
            }
        };

        socket.onerror = () => {
            statusDisplay.innerText = "Erreur de connexion au serveur.";
        };

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (board[clickedIndex] !== "" || !gameActive) return;

            // Assigne le rôle au premier clic si non défini
            if (!mySign) {
                // S'il y a plus de X que de O sur le terrain, on devient O, sinon X
                const xCount = board.filter(v => v === 'X').length;
                const oCount = board.filter(v => v === 'O').length;
                mySign = xCount <= oCount ? "X" : "O";
                alert("Vous jouez avec le symbole : " + mySign);
            }

            // Vérifie si c'est le tour du joueur
            if (currentTurn !== mySign) {
                statusDisplay.innerText = `Ce n'est pas votre tour ! Vous êtes ${mySign}.`;
                return;
            }

            // Met à jour localement et envoie aux autres appareils
            board[clickedIndex] = mySign;
            const nextTurn = mySign === "X" ? "O" : "X";

            const moveData = {
                type: "move",
                board: board,
                nextTurn: nextTurn
            };

            socket.send(JSON.stringify(moveData));
        }

        function updateUI() {
            cells.forEach((cell, index) => {
                cell.innerText = board[index];
                cell.className = `cell ${board[index]}`;
            });
            
            if (gameActive) {
                if (mySign) {
                    statusDisplay.innerText = currentTurn === mySign ? "À votre tour de jouer !" : `Attente de l'adversaire (${currentTurn})...`;
                } else {
                    statusDisplay.innerText = `Au tour du joueur ${currentTurn}. Cliquez pour rejoindre.`;
                }
            }
        }

        const winningConditions = [, [3, 4, 5], [6, 7, 8], // Lignes, [1, 4, 7], [2, 5, 8], // Colonnes, [2, 4, 6]             // Diagonales
        ];

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                const winner = currentTurn === "X" ? "O" : "X"; // Le joueur précédent a gagné
                statusDisplay.innerText = `Le joueur ${winner} a gagné ! 🎉`;
                gameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusDisplay.innerText = "Match nul ! 🤝";
                gameActive = false;
            }
        }

        function resetGame() {
            const resetData = { type: "reset" };
            socket.send(JSON.stringify(resetData));
        }
    </script>
</body>
</html>
